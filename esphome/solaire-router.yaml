# Point d'acces local dedie au Raspberry et au futur proxy Bluetooth.
# Il ne fournit pas Internet, mais reste protégé en WPA2.
# Adresse du point d'acces : 192.168.4.1/24

esphome:
  name: solaire-router
  friendly_name: Routeur solaire

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  # Sans reseau "station" configure, cet ESP reste un point d'acces local.
  power_save_mode: none
  ap:
    # Conserver le même SSID que le routeur installé et le proxy Bluetooth.
    ssid: "Cabanon Solaire"
    password: !secret cabanon_solaire_password
    channel: 6
    ap_timeout: 1s
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0
