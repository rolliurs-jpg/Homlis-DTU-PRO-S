# Proxy Bluetooth LE pour les micro-onduleurs du second ensemble.
# Il rejoint uniquement le point d'accès local "Cabanon Solaire".

esphome:
  name: solaire-proxy
  friendly_name: Proxy Bluetooth solaire

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # Débit explicite : le journal USB reste lisible avec un moniteur série à
  # 115200 bauds lors d'un diagnostic sur place.
  baud_rate: 115200

wifi:
  # Nom relevé sur le routeur installé (BSSID 70:4B:CA:16:BC:C9).
  ssid: "Cabanon Solaire"
  password: !secret cabanon_solaire_password
  # Le proxy ne connaît qu'un seul point d'accès dédié : se reconnecter sans
  # balayage complet réduit les aléas après le redémarrage du routeur ESP32.
  fast_connect: true
  # Après une coupure EDF, ne pas attendre le délai ESPHome par défaut
  # (15 minutes) si l'association Wi-Fi ne revient pas. Trois minutes laissent
  # néanmoins au routeur le temps de démarrer avant tout redémarrage du proxy.
  reboot_timeout: 3min
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.4.2
    gateway: 192.168.4.1
    subnet: 255.255.255.0

# API ESPHome locale utilisee par le Raspberry et habluetooth.
api:
  port: 6053
  # Si le Raspberry ne peut plus joindre l'API pendant cinq minutes,
  # redémarrer le proxy. Cela récupère les blocages où le Wi-Fi paraît
  # encore associé mais où le proxy n'est plus réellement accessible.
  reboot_timeout: 5min

ota:
  - platform: esphome

esp32_ble_tracker:

bluetooth_proxy:
  active: true
  connection_slots: 3
