<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu anonymisé du relevé EDF officiel</title><desc id="desc">Relevé EDF officiel et économie solaire locale mesurée.</desc>
  <rect width="1600" height="920" fill="#071321"/><rect x="0" width="230" height="920" fill="#0b1a2a"/><text x="36" y="70" fill="#edf4ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">☀ Mon solaire</text>
  <g font-family="Arial,sans-serif" font-size="22" fill="#a6bad1"><text x="36" y="155">⌂ Direct</text><text x="36" y="215">▥ Bilans</text><text x="36" y="275" fill="#edf4ff">€ Budget mensuel</text><text x="36" y="335">▰ Batterie</text></g><rect x="22" y="238" width="185" height="54" rx="12" fill="#172b42"/>
  <rect x="280" y="70" width="1270" height="760" rx="28" fill="#101f31" stroke="#2a3c51"/><text x="325" y="145" fill="#edf4ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Relevé EDF officiel</text><rect x="1250" y="102" width="250" height="48" rx="24" fill="#172b42"/><text x="1375" y="134" fill="#edf4ff" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">01/01 → aujourd’hui</text>
  <text x="325" y="205" fill="#a6bad1" font-family="Arial,sans-serif" font-size="22">Base EDF prolongée automatiquement par les index locaux Denky/Linky.</text>
  <g font-family="Arial,sans-serif"><g fill="#172b42" stroke="#2a3c51"><rect x="325" y="250" width="360" height="190" rx="22"/><rect x="715" y="250" width="360" height="190" rx="22"/><rect x="1105" y="250" width="360" height="190" rx="22"/><rect x="325" y="475" width="360" height="190" rx="22"/><rect x="715" y="475" width="360" height="190" rx="22"/><rect x="1105" y="475" width="360" height="190" rx="22"/></g>
  <g fill="#a6bad1" font-size="23"><text x="360" y="305">Heures pleines</text><text x="750" y="305">Heures creuses</text><text x="1140" y="305">Total acheté</text><text x="360" y="530">Énergie hors abonnement</text><text x="750" y="530">Abonnement</text><text x="1140" y="530">Économie solaire locale</text></g>
  <g fill="#edf4ff" font-size="39" font-weight="700"><text x="360" y="385">1 200 kWh</text><text x="750" y="385">620 kWh</text><text x="1140" y="385">1 820 kWh</text><text x="360" y="610">355,00 €</text><text x="750" y="610">198,00 €</text></g><text x="1140" y="610" fill="#48da9a" font-size="39" font-weight="700">216,00 €</text>
  <text x="325" y="730" fill="#a6bad1" font-family="Arial,sans-serif" font-size="21">Exemple anonymisé : les kWh EDF sont la référence de facturation ; le gain solaire est calculé uniquement sur les mesures locales.</text></g>
</svg>
