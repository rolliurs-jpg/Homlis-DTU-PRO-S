<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu anonymisé du budget mensuel</title><desc id="desc">Budget mensuel : EDF acheté, solaire et batterie séparés.</desc>
  <rect width="1600" height="920" fill="#071321"/><rect x="0" width="230" height="920" fill="#0b1a2a"/><text x="36" y="70" fill="#edf4ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">☀ Mon solaire</text>
  <g font-family="Arial,sans-serif" font-size="22" fill="#a6bad1"><text x="36" y="155">⌂ Direct</text><text x="36" y="215">▥ Bilans</text><text x="36" y="275" fill="#edf4ff">€ Budget mensuel</text><text x="36" y="335">▰ Batterie</text><text x="36" y="395">⚙ Équipements</text></g><rect x="22" y="238" width="185" height="54" rx="12" fill="#172b42"/>
  <g font-family="Arial,sans-serif"><text x="280" y="85" fill="#edf4ff" font-size="45" font-weight="700">Le budget du mois.</text><text x="280" y="123" fill="#a6bad1" font-size="22">Exemple anonymisé · mesures locales</text>
  <rect x="280" y="165" width="620" height="480" rx="24" fill="#101f31" stroke="#2a3c51"/><text x="320" y="220" fill="#edf4ff" font-size="30" font-weight="700">EDF · ce qui est acheté</text>
  <g fill="#a6bad1" font-size="23"><text x="325" y="290">Heures pleines</text><text x="325" y="365">Heures creuses</text><text x="325" y="440">Abonnement</text><text x="325" y="535">Total EDF</text></g><g fill="#edf4ff" font-size="34" font-weight="700" text-anchor="end"><text x="855" y="290">42,30 €</text><text x="855" y="365">18,60 €</text><text x="855" y="440">19,88 €</text><text x="855" y="535">80,78 €</text></g>
  <path d="M320 320H860M320 395H860M320 470H860" stroke="#2a3c51"/>
  <rect x="930" y="165" width="620" height="480" rx="24" fill="#101f31" stroke="#2a3c51"/><text x="970" y="220" fill="#edf4ff" font-size="30" font-weight="700">Solaire &amp; batterie · achats évités</text>
  <g fill="#a6bad1" font-size="23"><text x="975" y="290">Solaire direct vers la maison</text><text x="975" y="365">Économie solaire estimée</text><text x="975" y="440">Batterie restituée à la maison</text><text x="975" y="535">Économie locale estimée</text></g><g fill="#48da9a" font-size="34" font-weight="700" text-anchor="end"><text x="1505" y="290">186,40 kWh</text><text x="1505" y="365">36,20 €</text><text x="1505" y="440">24,10 kWh</text><text x="1505" y="535">40,85 €</text></g>
  <path d="M970 320H1510M970 395H1510M970 470H1510" stroke="#2a3c51"/>
  <rect x="280" y="680" width="1270" height="165" rx="24" fill="#101f31" stroke="#2a3c51"/><text x="320" y="740" fill="#edf4ff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Production et injection séparées</text><text x="320" y="790" fill="#a6bad1" font-family="Arial,sans-serif" font-size="23">L’injection n’est pas comptée comme une économie sans tarif de rachat EDF configuré.</text></g>
</svg>
